name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    name: Tests and Windows build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Set up Vite+, Node and pnpm
        uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          working-directory: frontend
          node-version: '24'
          cache: true
          run-install: false
      - run: make install
      - run: make check
      - name: Verify generated bindings are committed
        run: git diff --exit-code -- frontend/wailsjs
      - name: Install browser
        working-directory: frontend
        run: vp exec playwright install --with-deps chromium
      - name: Browser workflows
        working-directory: frontend
        run: vp exec playwright test
      - name: Package Windows artifact
        run: |
          python3 scripts/package-notices.py
          cp README.md THIRD_PARTY_NOTICES.md build/bin/
          mkdir -p build/bin/docs
          cp docs/windows-acceptance.md build/bin/docs/
          cp -r docs/screenshots build/bin/docs/
          cd build/bin
          sha256sum Daynote.exe > SHA256SUMS.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Daynote-windows-x64
          path: build/bin/
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: browser-failure-traces
          path: frontend/test-results/
          if-no-files-found: ignore
  windows-tests:
    name: Native Windows tests
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Test Windows packages
        run: go test -race -tags bindings ./...
